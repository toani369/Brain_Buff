
spring.application.name=demo

# HTTPS
server.forward-headers-strategy=framework

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/brainbuff?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.ResponseEntityExceptionHandler=TRACE

# JWT Configuration
genavault.jwt.secret=${JWT_SECRET}
genavault.jwt.expiration=86400000

# Server Port
server.port=8081
